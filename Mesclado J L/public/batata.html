<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Reserva de Salas - IFPE</title>

<link rel="stylesheet" href="batata.css">

</head>

<body>

<h1>Sistema de Reserva de Salas</h1>

<hr>

<div id="salas" class="container"></div>

<button onclick="irEditarUsuario()">
  Gerenciar Usuários
</button>

<script>
function irEditarUsuario() {
  window.location.href = "/usuarios";
}

let usuario="";
let inicio="";
let fim="";

async function carregarSessao(){

try{

const resposta=await fetch("/sessao");

if(!resposta.ok){

location.href="/usuarios";
return;

}

const dados=await resposta.json();

usuario=dados.usuario;
inicio=dados.inicio;
fim=dados.fim;

}catch{

location.href="/usuarios";

}

}

async function carregarSalas(){

try{

const resposta=await fetch("/salas");

const salas=await resposta.json();

const container=document.getElementById("salas");

container.innerHTML="";

salas.forEach(sala=>{

const card=document.createElement("div");

card.className="card";

const status=sala.usuario?"Ocupada":"Disponível";

card.innerHTML=`

<h2>${sala.nome}</h2>

<p><strong>Status:</strong> ${status}</p>

<p><strong>Usuário:</strong> ${sala.usuario||"-"}</p>

<p><strong>Até:</strong> ${sala.horario||"-"}</p>

${
sala.usuario
?
`<button onclick="liberar(${sala.id})">Liberar Sala</button>`
:
`<button onclick="reservar(${sala.id},'${sala.nome}')">Reservar Sala</button>`
}

`;

container.appendChild(card);

});

}catch{

alert("Erro ao carregar as salas.");

}

}

async function reservar(id,nome){

try{

const resposta=await fetch("/reservar",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

id,
usuario,
inicio,
fim

})

});

if(!resposta.ok){

alert(await resposta.text());
return;

}

await fetch("/horarios",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

usuario,
sala:nome,
inicio,
fim,
objetivo:"Reserva de sala",
observacao:""

})

});

carregarSalas();

}catch{

alert("Erro ao reservar sala.");

}

}

async function liberar(id){

try{

const resposta=await fetch("/liberar",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({id})

});

if(!resposta.ok){

alert(await resposta.text());
return;

}

carregarSalas();

}catch{

alert("Erro ao liberar sala.");

}

}

(async()=>{

await carregarSessao();

await carregarSalas();

setInterval(carregarSalas,30000);

})();

</script>

</body>

</html>
