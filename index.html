<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Salas</title>

<style>
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg,#020111,#000000,#360606);
    font-family:Arial;
}

.formulario{
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    text-align:center;
}

h1{
    color:white;
}

button{
    padding:14px 30px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#005f18;
}
</style>

</head>

<body>

<div class="formulario">

<h1>Sistema de Salas</h1>

<button onclick="entrar()">Entrar</button>

</div>

<script>

function entrar(){
    window.location.href = "/batata.html";
}

</script>

</body>
</html>
