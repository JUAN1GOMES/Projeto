<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Labs - IFPE</title>
<link rel="stylesheet" href="batata.css">   
</head>

<body>

<h1>Sistema de Labs - IFPE</h1>

<div class="cadastro">
    <input id="nomeUsuario" placeholder="Digite seu nome">
    <button onclick="cadastrar()">Cadastrar</button>
</div>

<hr>

<div id="salas" class="container"></div>

<script>
let usuarioAtual = "";

function cadastrar() {
    const nome = document.getElementById("nomeUsuario").value;

    if (!nome) {
        alert("Digite um nome");
        return;
    }

    usuarioAtual = nome;
    alert("Nome registrado!");
}

async function carregarSalas() {
    const res = await fetch("http://localhost:3000/salas");
    const registros = await res.json();

    const container = document.getElementById("salas");
    container.innerHTML = "";

    registros.forEach((sala) => {

        const card = document.createElement("div");
        card.classList.add("card");

        let status = sala.usuario === "" ? "Disponível" : "Ocupada";

        card.innerHTML = `
            <h2>${sala.nome}</h2>
            <p><strong>Status:</strong> ${status}</p>
            <p><strong>Usuário:</strong> ${sala.usuario || "-"}</p>
            <p><strong>Até:</strong> ${
                sala.horario_fim
                ? new Date(sala.horario_fim).toLocaleString()
                : "-"
            }</p>

            <button onclick="reservar(${sala.id})">Reservar</button>
            <button onclick="liberar(${sala.id})">Desalugar</button>
        `;

        container.appendChild(card);
    });
}

async function reservar(id) {

    if (!usuarioAtual) {
        alert("Cadastre o nome primeiro");
        return;
    }

    const horas = prompt("Quantas horas a sala será utilizada?(ex: 1, 2, 3, 5)");

    if (!horas) return;

    const horarioFim = new Date(
        Date.now() + Number(horas) * 60 * 60 * 1000
    ).toISOString();

    await fetch("http://localhost:3000/reservar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            id,
            usuario: usuarioAtual,
            horario_fim: horarioFim
        })
    });

    carregarSalas();
}

async function liberar(id) {

    await fetch("http://localhost:3000/liberar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ id })
    });

    carregarSalas();
}

carregarSalas();

setInterval(carregarSalas, 30000);
</script>
</body>
</html>
