<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Labs - IFPE</title>
<link rel="stylesheet" href="batata.css">
</head>

<body>

<h1>Sistema de Labs - IFPE</h1>

<hr>

<div id="salas" class="container"></div>

<script>

const usuario = localStorage.getItem("usuario");

if (!usuario) {
    alert("Selecione um usuário antes de entrar nas salas.");
    window.location.href = "/usuarios";
}

async function carregarSalas() {

    try {

        const resposta = await fetch("/salas");
        const salas = await resposta.json();

        const container = document.getElementById("salas");
        container.innerHTML = "";

        salas.forEach(sala => {

            const card = document.createElement("div");
            card.className = "card";

            const status = sala.usuario ? "Ocupada" : "Disponível";

            card.innerHTML = `
                <h2>${sala.nome}</h2>

                <p><strong>Status:</strong> ${status}</p>

                <p><strong>Usuário:</strong> ${sala.usuario || "-"}</p>

                <p><strong>Até:</strong> ${sala.horario || "-"}</p>

                ${
                    sala.usuario
                    ? `<button onclick="liberar(${sala.id})">Desocupar</button>`
                    : `<button onclick="reservar(${sala.id})">Reservar</button>`
                }

            `;

            container.appendChild(card);

        });

    } catch (erro) {

        alert("Erro ao carregar salas");

    }

}

async function reservar(id) {

    const horario = prompt("Até que horas vai utilizar a sala?");

    if (!horario) return;

    try {

        const resposta = await fetch("/reservar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                id: id,
                usuario: usuario,
                horario: horario

            })

        });

        if (!resposta.ok) {

            alert(await resposta.text());
            return;

        }

        carregarSalas();

    } catch (erro) {

        alert("Erro ao reservar sala");

    }

}

async function liberar(id) {

    try {

        const resposta = await fetch("/liberar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                id: id

            })

        });

        if (!resposta.ok) {

            alert(await resposta.text());
            return;

        }

        carregarSalas();

    } catch (erro) {

        alert("Erro ao liberar sala");

    }

}

carregarSalas();

setInterval(carregarSalas,30000);

</script>

</body>

</html>
